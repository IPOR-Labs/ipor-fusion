[profile.default]
solc = "0.8.30"
src = 'contracts'
out = 'out'
libs = ["node_modules", "lib"]
fs_permissions = [{ access = "read-write", path = "./" }]
libraries = []
remappings = [
    '@openzeppelin/=node_modules/@openzeppelin/',
    '@uniswap/v3-core/=node_modules/@uniswap/v3-core/',
    '@uniswap/v4-core/=node_modules/@uniswap/v4-core/',
    'eth-gas-reporter/=node_modules/eth-gas-reporter/',
    'ds-test/=lib/forge-std/lib/ds-test/src/',
    'forge-std/=lib/forge-std/src/',
    "@ethereum-vault-connector/=node_modules/ethereum-vault-connector/",
    "@pendle/core-v2/=node_modules/@pendle/core-v2/",
    # --- Crosschain POC vendored transport deps (contracts/vendor/) ---
    "@layerzerolabs/lz-evm-protocol-v2/contracts/=contracts/vendor/layerzero/protocol/contracts/",
    "@layerzerolabs/lz-evm-oapp-v2/contracts/=contracts/vendor/layerzero/oapp/contracts/",
    "@layerzerolabs/lz-evm-messagelib-v2/contracts/=contracts/vendor/layerzero/messagelib/contracts/",
    "@stargatefinance/stg-evm-v2/=contracts/vendor/stargate/",
    "solidity-bytes-utils/=contracts/vendor/solidity-bytes-utils/",
    "solady/=contracts/vendor/solady/src/"
]
optimizer_runs = 2
bytecode_hash = "none"
ignored_error_codes = [5667, 9302, 2462, 5574, 8760]
evm_version = "cancun"
# Forge 1.8+ defaults to --isolate (each top-level call is a separate tx), which clears
# transient storage between calls. Fuse tests set transient inputs and read them in separate calls.
isolate = false
ffi = true
# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[profile.crosschain_deploy]
# Fixed library addresses are isolated from the default test profile. Deployment
# scripts must use FOUNDRY_PROFILE=crosschain_deploy so that creation-code hashes
# and CREATE3 outputs are identical on every chain. The addresses are the libraries
# deployed from release 2026-10-21 (10f0f8e4), at the same address on Arbitrum and
# HyperEVM (ipor-abi mainnet-arbitrum-fusion / mainnet-hyperevm-fusion addresses.json).
libraries = [
    "contracts/crosschain/ccip/lib/CcipDecimalsLib.sol:CcipDecimalsLib:0x43bb2B17a1980c06d6039F08640Cac8FcA37F766",
    "contracts/crosschain/ccip/lib/CcipDispatcherLib.sol:CcipDispatcherLib:0x75E4311Bf1fe29673F690df34Db0e5f29FDf2566",
    "contracts/crosschain/ccip/lib/CcipExecutorAttestationLib.sol:CcipExecutorAttestationLib:0x0921B83330A54212094b9822a6D5697519B0DA9f",
    "contracts/crosschain/ccip/lib/CcipExecutorCommandLib.sol:CcipExecutorCommandLib:0xFF29Cf09B706fD333A43A0EF3c8962f097a218Ff",
    "contracts/crosschain/ccip/lib/CcipExecutorTransferLib.sol:CcipExecutorTransferLib:0x9AD0ED30fdd23c5e46F9043F13C7733eF932Ef2c",
    "contracts/crosschain/ccip/lib/CcipRouteLib.sol:CcipRouteLib:0x2045A36f6f884A7e80B8f27BD9673066C5c34d9A",
    "contracts/crosschain/ccip/lib/CcipSendLib.sol:CcipSendLib:0xf4CD217F464821822e069c8984168B723439B6Fb",
    "contracts/crosschain/lib/CrosschainVaultActionLib.sol:CrosschainVaultActionLib:0x385Aa46Dd127b6976B5803CFB448662647E3B6fC",
    "contracts/crosschain/lib/RescueLogicLib.sol:RescueLogicLib:0x38bbaab37b55d200e87d1a9B1524ADD1d4235E62",
    "contracts/crosschain/stargate/lib/StargateAssetSendLib.sol:StargateAssetSendLib:0xEE0c14275281fC270094A768031191a09813aD1B",
    "contracts/crosschain/stargate/lib/StargateDispatcherLib.sol:StargateDispatcherLib:0x9B20E3228Bf6DCf5c2df074486736615682F96aA",
    "contracts/crosschain/stargate/lib/StargateExecutorAccountingLib.sol:StargateExecutorAccountingLib:0xf05e3DF11d3f0Ada5942C70F0c6Da5b0C55433D4",
    "contracts/crosschain/stargate/lib/StargateExecutorAttestationLib.sol:StargateExecutorAttestationLib:0xf2ceaC4486084B7a495c75CA452b9FF06E5b9670",
    "contracts/crosschain/stargate/lib/StargateExecutorCommandLib.sol:StargateExecutorCommandLib:0x9173507f0BF4E48B0f971bd026b67813E23cC22D",
    "contracts/crosschain/stargate/lib/StargateExecutorDeploymentLib.sol:StargateExecutorDeploymentLib:0xD962Bf88631D48AA95B568bE85F665CaD884fd5A",
    "contracts/crosschain/stargate/lib/StargateFactoryLib.sol:StargateFactoryLib:0xd53901d236424AC231AD7D7F011D42c01C949dfD",
    "contracts/crosschain/stargate/lib/StargateLzSendLib.sol:StargateLzSendLib:0xE74551e430378F2A8E9171fDed4C09FdD5B0Df1E",
]

[profile.hypercore_deploy]
# Reproduces the executable bytecode of the HyperCore contracts deployed on HyperEVM
# from release 2026-10-21 (10f0f8e4): the HyperCore fuses, HyperCoreCapitalFlowPreHook,
# HyperCorePendingActionPreHook and HyperCorePendingReader (ipor-abi
# mainnet-hyperevm-fusion addresses.json). Any optimizer_runs value from 100,000 up
# yields the same executable code; 10,000 and the default profile's 2 do not. The
# deployed runtimes carry an IPFS metadata hash (solc 0.8.30), so bytecode_hash is
# ipfs here, but the exact runs value and the build environment of that deployment
# are not recorded: the metadata hash, and so the full runtime and codehash, do not
# reproduce from this checkout.
optimizer_runs = 1_000_000
bytecode_hash = "ipfs"

[profile.arbitrum]
# Arbitrum One supports Cancun opcodes (including PUSH0/EIP-1153). Keeping the
# same EVM target is required for byte-identical CREATE2/CREATE3 artifacts on
# Ethereum, Base, and Arbitrum.
evm_version = "cancun"
