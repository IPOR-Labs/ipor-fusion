[profile.default]
solc = "0.8.30"
src = 'contracts'
out = 'out'
libs = ["node_modules", "lib"]
fs_permissions = [{ access = "read-write", path = "./" }]
libraries = []
remappings = [
    '@openzeppelin/=node_modules/@openzeppelin/',
    '@uniswap/v3-core/=node_modules/@uniswap/v3-core/',
    '@uniswap/v4-core/=node_modules/@uniswap/v4-core/',
    'eth-gas-reporter/=node_modules/eth-gas-reporter/',
    'ds-test/=lib/forge-std/lib/ds-test/src/',
    'forge-std/=lib/forge-std/src/',
    "@ethereum-vault-connector/=node_modules/ethereum-vault-connector/",
    "@pendle/core-v2/=node_modules/@pendle/core-v2/"
]
optimizer_runs = 10000000
ignored_error_codes = [5667, 9302, 2462, 5574, 8760]
evm_version = "cancun"
# Forge 1.8+ defaults to --isolate (each top-level call is a separate tx), which clears
# transient storage between calls. Fuse tests set transient inputs and read them in separate calls.
isolate = false
ffi = true
# See more config options https://github.com/foundry-rs/foundry/tree/master/config

[profile.ci]
# CI intentionally inherits the complete default profile. The reusable workflow still
# runs unclassified suites, so restricting its FFI or filesystem access belongs to a
# separate migration after those suites have been catalogued.

[profile.factory_local]
# The classified local factory pilot does not use vm.ffi or filesystem cheatcodes.
ffi = false
fs_permissions = []

[profile.factory_ethereum]
# The classified Ethereum factory pilot only reads chain state through its RPC URL.
ffi = false
fs_permissions = []

[profile.arbitrum]
# Arbitrum inherits the default compiler and optimizer configuration. Paris is the
# only deliberate override for contracts deployed before the network enabled Cancun.
evm_version = "paris"
